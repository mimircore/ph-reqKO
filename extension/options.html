<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; min-width: 340px; margin: 0; padding: 12px; }
    h1 { font-size: 1rem; margin: 0 0 12px; }
    label { display: block; font-size: 0.85rem; margin-top: 10px; }
    input { font: inherit; width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; }
    button { font: inherit; padding: 6px 12px; margin-top: 12px; cursor: pointer; }
    .status { font-size: 0.85rem; margin-top: 10px; }
    .ok { color: #1b7f3b; }
    .error { color: #b3261e; }
    .muted { color: #888; font-size: 0.75rem; }
    code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>ph-reqKO blocker — options</h1>
  <label for="server-url">Server URL (ph-reqKO REST API, http/https)</label>
  <input id="server-url" type="text" spellcheck="false" placeholder="http://127.0.0.1:8080">
  <label for="client-token">Client token (REQKO_CLIENT_TOKEN of your server)</label>
  <input id="client-token" type="password" spellcheck="false" autocomplete="off">
  <button id="save">Save</button>
  <button id="grant-hosts">Grant site access (Firefox)</button>
  <div id="status" class="status" hidden></div>
  <p class="muted">
    The token is stored only in <code>browser.storage.local</code> on this device and is
    sent solely to the server URL above. The client scope can only read rule lists and
    report blocked-domain counts — nothing else.
  </p>
  <script type="module" src="options.js"></script>
</body>
</html>
